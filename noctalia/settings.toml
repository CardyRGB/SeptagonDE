config_version = 14

[bar.default]
background_opacity = 0.6
center = [ "group:g2" ]
end = [ "group:g4", "group:g1" ]
margin_ends = 0
radius = 16
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "group:g3" ]
thickness = 32

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "date", "clock" ]
    opacity = 0.30000001192092896
    padding = 11.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "cpu", "temp", "ram" ]
    opacity = 0.30000001192092896
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "workspaces", "session" ]
    opacity = 0.30000001192092896
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "network", "volume", "battery" ]
    opacity = 0.30000001192092896
    padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
position = "top_center"

[osd]
background_opacity = 0.0099999997764825821
position = "bottom_center"

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 2.0
font_family = "Space Grotesk"
input_borders = false
password_style = "random"
polkit_agent = true
popup_borders = false
time_format = "{:%I:%M}"

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"
    shadow = false

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/usr/share/backgrounds"

    [wallpaper.default]
    path = "/usr/share/backgrounds/septagrounds/SeptagonLinux.jpg"

    [wallpaper.last]
    path = "/usr/share/backgrounds/septagrounds/SeptagonLinux.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/backgrounds/septagrounds/SeptagonLinux.jpg"

[widget.cpu]
visualization = "none"

[widget.date]
format = "{:%a %d %b} |"

[widget.network]
show_label = false

[widget.ram]
visualization = "none"

[widget.temp]
visualization = "none"

[widget.volume]
show_label = false

[widget.workspaces]
show_labels = false
