config_version = 14

[bar]
order = [ "default", "bottom" ]

    [bar.bottom]
    background_opacity = 0.29999999329447746
    center = [ "taskbar" ]
    enabled = true
    end = [ "group:g1" ]
    margin_ends = 0
    position = "bottom"
    shadow = false
    start = [ "group:g2" ]
    thickness = 40

        [[bar.bottom.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "temp", "ram" ]
        opacity = 0.60000002384185791
        padding = 11.0

        [[bar.bottom.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "settings", "control-center" ]
        opacity = 0.60000002384185791
        padding = 11.0

    [bar.default]
    background_opacity = 0.29999999329447746
    capsule = true
    capsule_opacity = 0.29999999329447746
    center = [ "group:g1", "group:g2" ]
    end = [ "media", "group:g4" ]
    margin_ends = 0
    radius = 16
    radius_top_left = 0
    radius_top_right = 0
    shadow = false
    start = [ "workspaces" ]
    thickness = 32

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "date", "clock" ]
        opacity = 0.30000001192092896
        padding = 11.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = false
        fill = "surface_variant"
        id = "g2"
        members = [ "cpu", "temp", "ram" ]
        opacity = 0.30000001192092896
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "network", "volume", "battery", "session" ]
        opacity = 0.30000001192092896
        padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 416.0
    box_width = 1920.0
    cx = 960.0
    cy = 208.0
    flip_y = true
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        bands = 24
        centered = false
        color_1 = "secondary"
        color_2 = "tertiary"
        mirrored = true
        reversed = false
        show_when_idle = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
position = "top_center"

[osd]
background_opacity = 0.0099999997764825821
position = "bottom_center"

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 2.0
font_family = "Space Grotesk"
input_borders = false
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
popup_borders = false
time_format = "{:%I:%M}"

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"
    shadow = false

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "noctalia msg desktop-widgets-edit"
    countdown_seconds = 0.0
    enabled = true
    glyph = "edit"
    label = "Desktop Edit"
    variant = "default"

[theme]
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/usr/share/backgrounds"

    [wallpaper.default]
    path = "/usr/share/backgrounds/septagrounds/SeptagonRain.png"

    [wallpaper.last]
    path = "/usr/share/backgrounds/septagrounds/SeptagonRain.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/backgrounds/septagrounds/SeptagonRain.png"

[widget.cpu]
visualization = "none"

[widget.date]
format = "{:%a %d %b} |"

[widget.launcher]
glyph = "grid-dots"
scale = 1.5

[widget.media]
capsule_opacity = 0.29999999999999999
hide_album_art = true
hide_artist = true
hide_when_no_media = true
max_length = 800

[widget.network]
show_label = false

[widget.ram]
visualization = "none"

[widget.taskbar]
capsule_opacity = 0.59999999999999998
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.48999999999999999
minimal = true
scale = 1.5
show_active_indicator = false
workspace_label_placement = "inside"

[widget.temp]
visualization = "none"

[widget.volume]
show_label = false

[widget.workspaces]
show_labels = false
